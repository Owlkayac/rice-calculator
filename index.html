<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発送請求額計算</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; padding: 20px; }
.container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; }
h1 { text-align: center; }
.item { margin: 20px 0; }
label { display: block; font-weight: bold; margin-bottom: 8px; }
input, select { width: 80%; padding: 14px; font-size: 20px; box-sizing: border-box; }
input { text-align: right; }
button { width: 100%; padding: 16px; font-size: 18px; margin-top: 15px; border: none; border-radius: 10px; background: #222; color: white; }
.clear { background: #ddd; color: black; }
.result { margin-top: 25px; padding: 20px; background: #eee; border-radius: 15px; text-align: center; }
.result-line { margin: 8px 0; }
.total-label { margin-top: 18px; }
.total { font-size: 32px; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
<h1>発送請求額計算</h1>
<div class="item">
<label for="destPrefecture">配送先都道府県</label>
<select id="destPrefecture">
  <option value="">選択してください</option>
  <option>北海道</option>
  <option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option>
  <option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option>
  <option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option>
  <option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option>
  <option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option>
  <option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
</select>
</div>
<div class="item">
<label>商品A　1,850円/kg（税抜・消費税8%）</label>
<input id="a" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label>商品B　1,450円/kg（税抜・消費税8%）</label>
<input id="b" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label>商品C　863円/kg（税抜・消費税8%）</label>
<input id="c" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label>商品D　797円/kg（税抜・消費税8%）</label>
<input id="d" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="bookCount">書籍　1,600円（税抜・消費税10%）</label>
<input id="bookCount" type="number" min="0" step="1" placeholder="0"> 個
</div>
<div class="item">
<label for="weight">合計重量</label>
<input id="weight" type="number" placeholder="商品重量から自動計算" readonly> kg
</div>
<div class="item">
<label for="shipping">送料（税込）</label>
<input id="shipping" type="number" placeholder="配送先と重量を入力" readonly> 円
</div>
<button onclick="calculate()">計算する</button>
<button class="clear" onclick="clearAll()">クリア</button>
<div class="result">
<div class="result-line">商品A〜D代（税込・8%）</div><div id="productTotal">0円</div>
<div class="result-line">書籍（税込・10%）</div><div id="bookTotal">0円</div>
<div class="result-line">送料（税込・10%）</div><div id="shippingTotal">0円</div>
<div class="result-line total-label">請求額（税込）</div><div class="total" id="total">0円</div>
</div>
</div>
<script>
// 都道府県から送料グループを決めるテーブル。
const prefectureGroups = {
  北海道: "北海道・九州",
  青森県: "東北・関東・信越・北陸・東海", 岩手県: "東北・関東・信越・北陸・東海", 宮城県: "東北・関東・信越・北陸・東海", 秋田県: "東北・関東・信越・北陸・東海", 山形県: "東北・関東・信越・北陸・東海", 福島県: "東北・関東・信越・北陸・東海",
  茨城県: "東北・関東・信越・北陸・東海", 栃木県: "東北・関東・信越・北陸・東海", 群馬県: "東北・関東・信越・北陸・東海", 埼玉県: "埼玉県", 千葉県: "東北・関東・信越・北陸・東海", 東京都: "東北・関東・信越・北陸・東海", 神奈川県: "東北・関東・信越・北陸・東海",
  山梨県: "東北・関東・信越・北陸・東海", 長野県: "東北・関東・信越・北陸・東海", 新潟県: "東北・関東・信越・北陸・東海", 富山県: "東北・関東・信越・北陸・東海", 石川県: "東北・関東・信越・北陸・東海", 福井県: "東北・関東・信越・北陸・東海", 岐阜県: "東北・関東・信越・北陸・東海", 静岡県: "東北・関東・信越・北陸・東海", 愛知県: "東北・関東・信越・北陸・東海",
  滋賀県: "近畿", 京都府: "近畿", 大阪府: "近畿", 兵庫県: "近畿", 奈良県: "近畿", 和歌山県: "近畿",
  鳥取県: "中国・四国", 島根県: "中国・四国", 岡山県: "中国・四国", 広島県: "中国・四国", 山口県: "中国・四国", 徳島県: "中国・四国", 香川県: "中国・四国", 愛媛県: "中国・四国", 高知県: "中国・四国",
  福岡県: "北海道・九州", 佐賀県: "北海道・九州", 長崎県: "北海道・九州", 熊本県: "北海道・九州", 大分県: "北海道・九州", 宮崎県: "北海道・九州", 鹿児島県: "北海道・九州", 沖縄県: "沖縄県"
};

// 送料グループと重量帯（いずれも税込）のテーブル。
const shippingFees = {
  "埼玉県": { "1〜5kg": 605, "5.1〜10kg": 797, "11〜20kg": 1050, "21〜24kg": 1303 },
  "東北・関東・信越・北陸・東海": { "1〜5kg": 610, "5.1〜10kg": 854, "11〜20kg": 1092, "21〜24kg": 1353 },
  "近畿": { "1〜5kg": 693, "5.1〜10kg": 942, "11〜20kg": 1188, "21〜24kg": 1441 },
  "中国・四国": { "1〜5kg": 818, "5.1〜10kg": 1045, "11〜20kg": 1314, "21〜24kg": 1556 },
  "北海道・九州": { "1〜5kg": 1023, "5.1〜10kg": 1265, "11〜20kg": 1507, "21〜24kg": 1760 },
  "沖縄県": { "1〜5kg": 1056, "5.1〜10kg": 1342, "11〜20kg": 1622, "21〜24kg": 1908 }
};

function getWeightBand(weightKg) {
  const weight = Number(weightKg);
  if (!Number.isFinite(weight) || weight <= 0 || weight > 24) {
    throw new Error(`重量の範囲外です（1〜24kg）: ${weightKg}`);
  }
  if (weight <= 5) return "1〜5kg";
  if (weight <= 10) return "5.1〜10kg";
  if (weight <= 20) return "11〜20kg";
  return "21〜24kg";
}

function calcShippingFee(destPrefecture, weightKg) {
  const group = prefectureGroups[destPrefecture];
  if (!group) throw new Error(`未対応の都道府県です: ${destPrefecture}`);
  const band = getWeightBand(weightKg);
  return shippingFees[group][band];
}

function formatYen(amount) { return amount.toLocaleString() + "円"; }
function calculateTaxIncluded(netAmount, taxRate) { return Math.floor(netAmount * taxRate); }

function calculate() {
  try {
    const destPrefecture = document.getElementById("destPrefecture").value;
    const a = Number(document.getElementById("a").value) || 0;
    const b = Number(document.getElementById("b").value) || 0;
    const c = Number(document.getElementById("c").value) || 0;
    const d = Number(document.getElementById("d").value) || 0;
    const bookCountValue = document.getElementById("bookCount").value;
    const bookCount = Number(bookCountValue) || 0;
    if (bookCountValue !== "" && (!Number.isInteger(bookCount) || bookCount < 0)) {
      throw new Error("書籍の個数は0以上の整数で入力してください");
    }
    const weight = a + b + c + d;
    const shipping = calcShippingFee(destPrefecture, weight);
    document.getElementById("weight").value = weight;
    document.getElementById("shipping").value = shipping;

    // 商品ごとに税抜単価×重量を計算し、商品ごとに税込金額を切り捨てる。
    const productTotal = calculateTaxIncluded(a * 1850, 1.08)
      + calculateTaxIncluded(b * 1450, 1.08)
      + calculateTaxIncluded(c * 863, 1.08)
      + calculateTaxIncluded(d * 797, 1.08);
    // 書籍は税抜合計（1,600円×個数）に10%を加え、1円未満を切り捨てる。
    const bookTotal = calculateTaxIncluded(1600 * bookCount, 1.10);
    const total = productTotal + bookTotal + shipping;
    document.getElementById("productTotal").textContent = formatYen(productTotal);
    document.getElementById("bookTotal").textContent = formatYen(bookTotal);
    document.getElementById("shippingTotal").textContent = formatYen(shipping);
    document.getElementById("total").textContent = formatYen(total);
  } catch (error) { alert(error.message); }
}

function clearAll() {
  ["destPrefecture", "a", "b", "c", "d", "bookCount", "weight", "shipping"].forEach(id => { document.getElementById(id).value = ""; });
  ["productTotal", "bookTotal", "shippingTotal", "total"].forEach(id => { document.getElementById(id).textContent = "0円"; });
}
</script>
</body>
</html>
