<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発送請求額計算</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; padding: 20px; }
.container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; }
h1 { text-align: center; }
.item { margin: 20px 0; }
label { display: block; font-weight: bold; margin-bottom: 8px; }
input, select { width: 80%; padding: 14px; font-size: 20px; box-sizing: border-box; }
input { text-align: right; }
/* 自動計算の欄（入力できない欄）は色を変えて、入力欄と見分けられるようにする */
input[readonly] { background: #e8f1fb; border: 1px solid #b6cde6; color: #1a3d63; font-weight: bold; }
input[readonly]::placeholder { color: #6f8aa6; font-weight: normal; font-size: 16px; }
.auto-note { font-size: 12px; font-weight: normal; color: #1a3d63; background: #e8f1fb; border-radius: 6px; padding: 2px 6px; margin-left: 6px; white-space: nowrap; }
button { width: 100%; padding: 16px; font-size: 18px; margin-top: 15px; border: none; border-radius: 10px; background: #222; color: white; }
.clear { background: #ddd; color: black; }
/* 計算するとクリアを横に並べる。押し間違えないよう間をあけ、クリアは小さめにする */
.actions { display: flex; gap: 16px; margin-top: 15px; }
.actions button { margin-top: 0; padding: 16px 8px; white-space: nowrap; }
.actions .calc { flex: 2; }
.actions .clear { flex: 1; min-width: 80px; }
.tabs { display: flex; gap: 8px; }
.tab { flex: 1; margin-top: 0; padding: 12px; font-size: 16px; background: #ddd; color: black; }
.tab.active { background: #222; color: white; }
.tab-note { font-size: 14px; color: #555; text-align: center; }
#shippingBand { white-space: nowrap; }
.result { margin-top: 25px; padding: 20px; background: #eee; border-radius: 15px; text-align: center; }
.result-line { margin: 8px 0; }
.total-label { margin-top: 18px; }
.total { font-size: 32px; font-weight: bold; }
.link { text-align: center; margin-top: 25px; }
</style>
</head>
<body>
<div class="container">
<h1>発送請求額計算</h1>
<div class="tabs" role="tablist">
<button type="button" class="tab active" id="tab-normal" role="tab" aria-selected="true" onclick="selectPackaging('normal')">普通計算</button>
<button type="button" class="tab" id="tab-simple" role="tab" aria-selected="false" onclick="selectPackaging('simple')">簡易包装計算</button>
</div>
<p class="tab-note" id="packagingNote"></p>
<div class="item">
<label for="destPrefecture">配送先都道府県</label>
<select id="destPrefecture">
  <option value="">選択してください</option>
  <option>北海道</option>
  <option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option>
  <option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option>
  <option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option>
  <option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option>
  <option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option>
  <option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
</select>
</div>
<div class="item">
<label for="a">商品A</label>
<input id="a" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="b">商品B</label>
<input id="b" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="c">商品C</label>
<input id="c" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="d">商品D</label>
<input id="d" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="e">商品E</label>
<input id="e" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="f">商品F</label>
<input id="f" type="number" min="0" step="0.01" placeholder="0"> kg
</div>
<div class="item">
<label for="riceFlourWeight">米粉</label>
<input id="riceFlourWeight" type="number" min="0" step="1" placeholder="0"> g
</div>
<div class="item">
<label for="riceBranWeight">米ぬか</label>
<input id="riceBranWeight" type="number" min="0" step="1" placeholder="0"> g
</div>
<div class="item">
<label for="bookCount">書籍</label>
<input id="bookCount" type="number" min="0" step="1" placeholder="0"> 個
</div>
<div class="item">
<label for="weight">合計重量（書籍を除く）<span class="auto-note">自動計算</span></label>
<input id="weight" type="number" placeholder="計算すると表示" readonly tabindex="-1"> kg
</div>
<div class="item">
<label for="shipping">送料（税込）<span class="auto-note">自動計算</span></label>
<input id="shipping" type="number" placeholder="計算すると表示" readonly tabindex="-1"> 円
</div>
<div class="actions">
<button type="button" class="calc" onclick="calculate()">計算する</button>
<button type="button" class="clear" onclick="clearAll()">クリア</button>
</div>
<div class="result">
<div class="result-line">商品A〜F代（税込・8%）</div><div id="productTotal">0円</div>
<div class="result-line">米粉（税込・8%）</div><div id="riceFlourTotal">0円</div>
<div class="result-line">米ぬか（税込・8%）</div><div id="riceBranTotal">0円</div>
<div class="result-line">書籍（税込・10%）</div><div id="bookTotal">0円</div>
<div class="result-line">送料（税込・10%）<span id="shippingBand"></span></div><div id="shippingTotal">0円</div>
<div class="result-line total-label">請求額（税込）</div><div class="total" id="total">0円</div>
</div>
<p class="link"><a href="shipping-fees.html">送り先別の送料一覧を見る</a></p>
</div>
<!-- ?v=2 は版の印。shipping-fees.js を変えたら数字を上げ、スマホが古いファイルを使い回さないようにする -->
<script src="shipping-fees.js?v=2"></script>
<script>
// 価格表（税抜）。画面のラベルと計算の両方がここを使う。価格を変えるときはここだけ直す。
// （税率の8%・10%は、ラベル・結果欄の文字と計算の108・110の両方に書いてある。税率を変えるときは両方直す）
// specialPrices は「この重さ（kg）ちょうどのときの特別な税抜価格」。
const products = [
  { id: "a", name: "商品A", unitPrice: 1850 },
  { id: "b", name: "商品B", unitPrice: 1450 },
  { id: "c", name: "商品C", unitPrice: 863, specialPrices: { 1: 907, 2: 1764, 3: 2615, 5: 4315 } },
  { id: "d", name: "商品D", unitPrice: 797, specialPrices: { 1: 841, 2: 1632, 3: 2417, 5: 3985 } },
  { id: "e", name: "商品E", unitPrice: 697 },
  { id: "f", name: "商品F", unitPrice: 1450 }
];
const riceFlour = { price: 270, perGrams: 300 }; // 米粉：300gあたり270円
const riceBran = { price: 100, perGrams: 100 };   // 米ぬか：100gあたり100円
const bookPrice = 1600;                           // 書籍：1個1,600円
const MAX_BOOK_COUNT = 999;                       // 書籍の個数の上限（打ち間違い防止）

const MAX_WEIGHT_KG = 24;

// いま選んでいるタブ（"normal"＝普通計算、"simple"＝簡易包装計算）。
let packaging = "normal";
const packagingNames = { normal: "普通", simple: "簡易包装" };

// 合計重量から、送料表のどの列（1番〜4番）を使うかを返す。列の決め方は包装の種類（タブ）で違う。
// 重量0（書籍のみの注文）は最小の重量帯で送る。
function getWeightBand(weight) {
  if (weight > MAX_WEIGHT_KG) {
    throw new Error(`合計重量が${MAX_WEIGHT_KG}kgを超えています（${weight}kg）。2箱に分けて計算してください`);
  }
  const rule = packagingRules[packaging].find(candidate => weight <= candidate.maxKg);
  if (!rule) throw new Error(`この重さの送料が設定されていません（${weight}kg）`);
  return rule.column;
}

function calcShippingFee(destPrefecture, weight) {
  if (destPrefecture === "") throw new Error("配送先都道府県を選んでください");
  const group = prefectureGroups[destPrefecture];
  if (!group) throw new Error(`送料が設定されていない都道府県です: ${destPrefecture}`);
  const band = getWeightBand(weight);
  const fee = shippingFees[group]?.[band];
  if (typeof fee !== "number") throw new Error(`送料の設定が見つかりません: ${group} / ${band}`);
  return { fee, band };
}

function formatYen(amount) { return amount.toLocaleString("ja-JP") + "円"; }

// 税込額の1円未満を切り捨てる。小数の計算誤差を避けるため、分子・分母とも整数で渡す。
function floorDivide(numerator, denominator) { return Math.floor(numerator / denominator); }

// 入力を「小数第decimals位まで」の数値として読み、10^decimals倍した整数で返す（例: 1.25kg → 125）。
// 空欄は0。マイナス・数値以外・桁数オーバーはエラーにする。
function readAmount(id, label, decimals) {
  const input = document.getElementById(id);
  // 「1.2.3」など読めない入力は、ブラウザが空欄として渡すため先に調べる。
  if (input.validity.badInput) throw new Error(`${label}は数値で入力してください`);
  const raw = input.value.trim();
  if (raw === "") return 0;
  const match = raw.match(/^\d+(?:\.(\d+))?$/);
  if (raw.startsWith("-")) throw new Error(`${label}は0以上で入力してください`);
  const example = decimals === 0 ? "12" : "1.25";
  if (!match) throw new Error(`${label}は「${example}」のように半角数字で入力してください（「.5」「1e3」のような書き方は使えません）`);
  const fraction = match[1] ?? "";
  if (fraction.length > decimals) {
    throw new Error(decimals === 0 ? `${label}は整数で入力してください` : `${label}は小数第${decimals}位までで入力してください`);
  }
  return Math.round(Number(raw) * 10 ** decimals);
}

// 税込額（1円未満切り捨て）。重量は0.01kg単位の整数、単価は円/kg。
// 指定重量ちょうどのときだけ特別な税抜価格を使う（C・D）。
function productTaxIncluded(weightCentiKg, unitPrice, specialPrices = {}) {
  const special = specialPrices[weightCentiKg / 100];
  // 税抜額を「0.01円単位」の整数にそろえてから8%を加える。
  // 割る数の 100 * 100 は、「0.01円単位を円に戻す100」と「108%の%を外す100」。
  const netCentiYen = special !== undefined ? special * 100 : unitPrice * weightCentiKg;
  return floorDivide(netCentiYen * 108, 100 * 100);
}

function showResults(values) {
  // 例：「（簡易包装・2番）」。どちらのタブで計算した送料かを結果だけで分かるようにする。
  document.getElementById("shippingBand").textContent = values.band ? `（${packagingNames[packaging]}・${values.band}）` : "";
  ["weight", "shipping"].forEach(id => { document.getElementById(id).value = values[id] ?? ""; });
  ["productTotal", "riceFlourTotal", "riceBranTotal", "bookTotal", "shippingTotal", "total"].forEach(id => {
    document.getElementById(id).textContent = formatYen(values[id] ?? 0);
  });
}

// 前回の結果を消す（エラー時・入力変更時に、古い請求額が残らないようにする）。
function resetResults() { showResults({}); }

function calculate() {
  try {
    const destPrefecture = document.getElementById("destPrefecture").value;
    // 商品A〜Fの重量は0.01kg単位、米粉・米ぬかはg単位、書籍は個数（いずれも整数）。
    const weights = products.map(product => readAmount(product.id, `${product.name}の重量`, 2));
    const productWeightSum = weights.reduce((sum, w) => sum + w, 0);
    const riceFlourWeight = readAmount("riceFlourWeight", "米粉の重量", 0);
    const riceBranWeight = readAmount("riceBranWeight", "米ぬかの重量", 0);
    const bookCount = readAmount("bookCount", "書籍の個数", 0);
    // 書籍は重さの上限（24kg）で止まらないため、個数に上限を設ける。
    if (bookCount > MAX_BOOK_COUNT) throw new Error(`書籍の個数は${MAX_BOOK_COUNT}個までで入力してください`);

    if (productWeightSum + riceFlourWeight + riceBranWeight + bookCount === 0) {
      throw new Error("商品の数量を入力してください");
    }

    // 合計重量は商品A〜F＋米粉＋米ぬか。書籍は含めない。g単位で足してからkgにする。
    const weight = (productWeightSum * 10 + riceFlourWeight + riceBranWeight) / 1000;
    const { fee: shipping, band } = calcShippingFee(destPrefecture, weight);

    // 商品ごとに税抜金額へ8%を加え、商品ごとに税込金額を切り捨てる。
    const productTotal = products.reduce(
      (sum, product, i) => sum + productTaxIncluded(weights[i], product.unitPrice, product.specialPrices), 0);
    // 米粉は300gあたり270円（税抜）に8%を加え、1円未満を切り捨てる。
    const riceFlourTotal = floorDivide(riceFlour.price * riceFlourWeight * 108, riceFlour.perGrams * 100);
    // 米ぬかは100gあたり100円（税抜）に8%を加え、1円未満を切り捨てる。
    const riceBranTotal = floorDivide(riceBran.price * riceBranWeight * 108, riceBran.perGrams * 100);
    // 書籍は税抜合計（1,600円×個数）に10%を加え、1円未満を切り捨てる。
    const bookTotal = floorDivide(bookPrice * bookCount * 110, 100);
    const total = productTotal + riceFlourTotal + riceBranTotal + bookTotal + shipping;

    showResults({ weight, shipping, band, productTotal, riceFlourTotal, riceBranTotal, bookTotal, shippingTotal: shipping, total });
  } catch (error) {
    resetResults();
    alert(error.message);
  }
}

function clearAll() {
  ["destPrefecture", ...products.map(product => product.id), "riceFlourWeight", "riceBranWeight", "bookCount"].forEach(id => { document.getElementById(id).value = ""; });
  resetResults();
}

// タブを切り替える。入力はそのまま残し、送料の決め方が変わるので結果は消す。
function selectPackaging(mode) {
  if (mode === packaging) return;
  packaging = mode;
  showPackaging();
  resetResults();
}

// いま選んでいるタブの見た目と、送料の対応表の説明文を表示する。
function showPackaging() {
  const mode = packaging;
  ["normal", "simple"].forEach(m => {
    const tab = document.getElementById(`tab-${m}`);
    tab.classList.toggle("active", m === mode);
    tab.setAttribute("aria-selected", m === mode);
  });
  // 例：「送料：〜5kg→1番、5kg超〜14kg→2番、14kg超〜24kg→3番」
  document.getElementById("packagingNote").textContent = `送料：${describePackagingRule(packagingRules[mode])}`;
}

// 入力を変えたら、計算し直すまで古い結果を表示しない。
document.querySelectorAll("#destPrefecture, input:not([readonly])").forEach(el => {
  // 古いiPhoneは選択欄でinputが起きないため、changeでも消す。
  el.addEventListener("input", resetResults);
  el.addEventListener("change", resetResults);
});

// 商品のラベルを価格表から作る（例：「商品A　1,850円/kg（税抜・消費税8%）」）。
// HTMLには商品名だけを書いてあり、ここで価格を付け足す。
function showPriceLabels() {
  const setLabel = (id, text) => { document.querySelector(`label[for="${id}"]`).textContent = text; };
  products.forEach(product => setLabel(product.id, `${product.name}　${formatYen(product.unitPrice)}/kg（税抜・消費税8%）`));
  setLabel("riceFlourWeight", `米粉　${riceFlour.perGrams}gあたり${formatYen(riceFlour.price)}（税抜・消費税8%）`);
  setLabel("riceBranWeight", `米ぬか　${riceBran.perGrams}gあたり${formatYen(riceBran.price)}（税抜・消費税8%）`);
  setLabel("bookCount", `書籍　${formatYen(bookPrice)}（税抜・消費税10%）`);
}

showPackaging();
showPriceLabels();

</script>
</body>
</html>
