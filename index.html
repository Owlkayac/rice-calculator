<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発送請求額計算</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
}

h1 {
  text-align: center;
}

.item {
  margin: 20px 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 80%;
  padding: 14px;
  font-size: 20px;
  box-sizing: border-box;
  text-align: right;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
}

.clear {
  background: #ddd;
  color: black;
}

.result {
  margin-top: 25px;
  padding: 20px;
  background: #eee;
  border-radius: 15px;
  text-align: center;
}

.result-line {
  margin: 8px 0;
}

.total-label {
  margin-top: 18px;
}

.total {
  font-size: 32px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>発送請求額計算</h1>

<div class="item">
<label>商品A　1,850円/kg（税抜・消費税8%）</label>
<input id="a" type="number" min="0" step="0.01" placeholder="0">
kg
</div>

<div class="item">
<label>商品B　1,450円/kg（税抜・消費税8%）</label>
<input id="b" type="number" min="0" step="0.01" placeholder="0">
kg
</div>

<div class="item">
<label>商品C　863円/kg（税抜・消費税8%）</label>
<input id="c" type="number" min="0" step="0.01" placeholder="0">
kg
</div>

<div class="item">
<label for="shipping">送料（税抜）</label>
<input id="shipping" type="number" min="0" step="1" placeholder="0">
円
</div>

<button onclick="calculate()">計算する</button>

<button class="clear" onclick="clearAll()">クリア</button>

<div class="result">
<div class="result-line">商品代（税込・8%）</div>
<div id="productTotal">0円</div>
<div class="result-line">送料（税込・10%）</div>
<div id="shippingTotal">0円</div>
<div class="result-line total-label">請求額（税込）</div>
<div class="total" id="total">0円</div>
</div>

</div>

<script>

function formatYen(amount) {
  return Math.round(amount).toLocaleString() + "円";
}

function calculate() {

  const a = Number(document.getElementById("a").value) || 0;
  const b = Number(document.getElementById("b").value) || 0;
  const c = Number(document.getElementById("c").value) || 0;
  const shipping = Number(document.getElementById("shipping").value) || 0;

  const productTotal = (
    a * 1850 +
    b * 1450 +
    c * 863
  ) * 1.08;
  const shippingTotal = shipping * 1.10;
  const total = productTotal + shippingTotal;

  document.getElementById("productTotal").textContent = formatYen(productTotal);
  document.getElementById("shippingTotal").textContent = formatYen(shippingTotal);
  document.getElementById("total").textContent = formatYen(total);
}

function clearAll() {

  document.getElementById("a").value = "";
  document.getElementById("b").value = "";
  document.getElementById("c").value = "";
  document.getElementById("shipping").value = "";

  document.getElementById("productTotal").textContent = "0円";
  document.getElementById("shippingTotal").textContent = "0円";
  document.getElementById("total").textContent = "0円";
}

</script>

</body>
</html>
